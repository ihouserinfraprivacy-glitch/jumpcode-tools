[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "jumpcode-webstudio"
version = "1.0.0"
description = "WebStudio: builds static websites live inside a JumpCode Studio"
readme = "README.md"
requires-python = ">=3.11,<3.15"
license = "MIT"
dependencies = []

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
jumpcode_webstudio = ["tool.json"]
