[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "jumpcode-taskstudio"
version = "1.0.0"
description = "TaskStudio: plans a request as linked tasks and tracks them inside a JumpCode Studio"
readme = "README.md"
requires-python = ">=3.11,<3.15"
license = "MIT"
dependencies = []

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
jumpcode_taskstudio = ["tool.json", "ui/*.js", "ui/*.css", "assets/*"]
