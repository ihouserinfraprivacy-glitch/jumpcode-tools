apiVersion: apps/v1
kind: Deployment
metadata:
  name: pagamentos
  namespace: rota-certa
spec:
  replicas: 2
  selector:
    matchLabels:
      app: pagamentos
  template:
    metadata:
      labels:
        app: pagamentos
    spec:
      containers:
        - name: pagamentos
          image: rotacerta/pagamentos:1.2.0
          ports:
            - containerPort: 9090
---
apiVersion: v1
kind: Service
metadata:
  name: pagamentos
  namespace: rota-certa
spec:
  selector:
    app: pagamentos
  ports:
    - port: 9090
