apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: entrada
  namespace: rota-certa
spec:
  rules:
    - host: api.rotacerta.com.br
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: api-gateway
                port:
                  number: 80
