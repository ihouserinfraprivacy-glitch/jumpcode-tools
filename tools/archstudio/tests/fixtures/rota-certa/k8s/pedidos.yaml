apiVersion: apps/v1
kind: Deployment
metadata:
  name: pedidos
  namespace: rota-certa
spec:
  replicas: 3
  selector:
    matchLabels:
      app: pedidos
  template:
    metadata:
      labels:
        app: pedidos
    spec:
      containers:
        - name: pedidos
          image: rotacerta/pedidos:1.4.0
          ports:
            - containerPort: 8081
          env:
            - name: PAGAMENTOS_ADDR
              value: pagamentos:9090
---
apiVersion: v1
kind: Service
metadata:
  name: pedidos
  namespace: rota-certa
spec:
  selector:
    app: pedidos
  ports:
    - port: 8081
