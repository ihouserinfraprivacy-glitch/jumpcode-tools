apiVersion: apps/v1
kind: Deployment
metadata:
  name: rastreamento
  namespace: rota-certa
spec:
  replicas: 2
  selector:
    matchLabels:
      app: rastreamento
  template:
    metadata:
      labels:
        app: rastreamento
    spec:
      containers:
        - name: rastreamento
          image: rotacerta/rastreamento:1.1.0
          ports:
            - containerPort: 8086
