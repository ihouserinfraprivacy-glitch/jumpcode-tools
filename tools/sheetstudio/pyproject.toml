[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "jumpcode-sheetstudio"
version = "1.0.0"
description = "SheetStudio: the project's spreadsheets (CSV, TSV, XLSX, XLS, ODS) read on this computer, with charts shown inside a JumpCode Studio"
readme = "README.md"
requires-python = ">=3.11,<3.15"
license = "MIT"
dependencies = []

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
jumpcode_sheetstudio = ["tool.json", "ui/*.js", "ui/*.css", "assets/*"]
